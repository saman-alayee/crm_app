<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6f5644" />
    <title>آفلاین | فروشگاه سامی</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tahoma, sans-serif;
        background: #f6f1ea;
        color: #3c322b;
        padding: 1.5rem;
      }
      .box {
        max-width: 22rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e6d8cb;
        border-radius: 1.25rem;
        padding: 1.5rem;
      }
      h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
      p { margin: 0; font-size: 0.875rem; color: #8c7f72; line-height: 1.7; }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.85rem;
        background: #6f5644;
        color: #fff;
        padding: 0.7rem 1.2rem;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>اتصال اینترنت نیست</h1>
      <p>اپ نصب‌شده است، اما برای ورود و داده‌های زنده به شبکه نیاز دارید.</p>
      <button type="button" onclick="location.reload()">تلاش مجدد</button>
    </div>
  </body>
</html>
